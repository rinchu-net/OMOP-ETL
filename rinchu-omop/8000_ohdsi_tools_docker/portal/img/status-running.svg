<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="24" height="24">
  <!-- Green circle background -->
  <circle cx="24" cy="24" r="22" fill="#4CAF50" stroke="#2E7D32" stroke-width="2"/>
  
  <!-- Running indicator: right-pointing play arrow -->
