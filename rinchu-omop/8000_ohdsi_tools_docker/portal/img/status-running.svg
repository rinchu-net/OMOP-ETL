  <!-- Motion lines to show movement -->
  <line x1="8" y1="18" x2="12" y2="18" stroke="white" stroke-width="2" stroke-linecap="round"/>
  <line x1="6" y1="24" x2="10" y2="24" stroke="white" stroke-width="2" stroke-linecap="round"/>
  <line x1="8" y1="30" x2="12" y2="30" stroke="white" stroke-width="2" stroke-linecap="round"/>
</svg>
