#BuildNumber Version property stub until migration to spring boot 2
build.number=NA

spring.profiles.active=default

# Logging
logging.level.org.springframework.web=info
logging.level.org.hibernate=info
logging.level.root=info
logging.level.org.ohdsi=info
logging.level.org.springframework.orm=info
logging.level.org.springframework.jdbc=info
logging.level.org.apache.shiro=warn

#Primary DataSource
datasource.driverClassName=org.postgresql.Driver
datasource.url=jdbc:postgresql://omopdb:5432/OHDSI
datasource.username=ohdsi_app_user
datasource.password=app1
datasource.dialect=postgresql
datasource.ohdsi.schema=webapi
datasource.dialect.source=sql server

#CDM properties
source.name=CDM_NAME
cdm.version=5

#R Service Host
r.serviceHost=${r.serviceHost}

#Flyway database change management.
#DataSource for Change Managment / Migration
flyway.enabled=true
flyway.datasource.driverClassName=org.postgresql.Driver
flyway.datasource.url=jdbc:postgresql://omopdb:5432/OHDSI
flyway.datasource.username=ohdsi_admin_user
flyway.datasource.password=admin1
# check that migration scripts location exists
flyway.check-location=true
flyway.locations=classpath:db/migration/postgresql
# locations of migrations scripts
# schemas to manage/update (e.g. ohdsi/results schema) -NOTE: CASE SENSITIVE!
flyway.schemas=webapi
#Baseline - start flyway managment with existing objects
flyway.baselineOnMigrate=true
#Due to issue https://github.com/flyway/flyway/issues/752 use default baselineVersion=1 (Note equality to 1.0.0.0, so scripts with that version will be omitted)
#flyway.baselineVersion=1.0.0.0
flyway.validateOnMigrate=false
# Enable out of order migrations due to distributed development nature of WebAPI
flyway.outOfOrder=true
# Flyway Placeholders:
flyway.placeholders.ohdsiSchema=webapi

#Disable any auto init
#http://docs.spring.io/spring-boot/docs/current/reference/html/howto-database-initialization.html
spring.datasource.initialize=false
#JPA / Spring Data
spring.jpa.show-sql=false
# JPA Default Schema
spring.jpa.properties.hibernate.default_schema=webapi
#JPA Dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQL9Dialect
spring.jpa.properties.hibernate.generate_statistics=false
spring.jpa.properties.hibernate.jdbc.batch_size=200
spring.jpa.properties.hibernate.order_inserts=true

#Spring Cache
spring.cache.jcache.config=classpath:appCache.xml
spring.cache.type=jcache

#JAX-RS
jersey.resources.root.package=org.ohdsi.webapi

#Spring boot auto starts jobs upon application start
spring.batch.job.enabled=false
#Disable auto init of spring batch tables
spring.batch.initializer.enabled=false
#Custom properties
spring.batch.repository.tableprefix=webapi.BATCH_
spring.batch.repository.isolationLevelForCreate=ISOLATION_READ_COMMITTED
spring.batch.taskExecutor.corePoolSize=10
spring.batch.taskExecutor.maxPoolSize=20
spring.batch.taskExecutor.queueCapacity=2147483647
spring.batch.taskExecutor.threadGroupName=
spring.batch.taskExecutor.threadNamePrefix=

# EMBEDDED SERVER CONFIGURATION (ServerProperties)
server.port = 8080
server.ssl.enabled = false
server.ssl.key-store = 
server.ssl.key-store-password = 
server.ssl.key-password = 
# the context path, defaults to '/'
server.context-path=/WebAPI
security.cas.loginUrl=
security.cas.callbackUrl=
security.cas.serverUrl=
security.cas.cassvcs=
security.cas.casticket=casticket
# Full Text Search settings
solr.endpoint = ${solr.endpoint}
solr.query.prefix = ${solr.query.prefix}
# Enabling Compression
compression=on
compressableMimeType=application/json,application/xml,text/html,text/xml,text/plain


#Disabled to support Basic Auth and RESTful interface
#http://docs.spring.io/spring-security/site/docs/3.2.x-SNAPSHOT/reference/html5/#when-to-use-csrf-protection
