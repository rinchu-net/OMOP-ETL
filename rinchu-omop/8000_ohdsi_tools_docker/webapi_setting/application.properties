#Hikari
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.connection-test-query-timeout=2000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.register-mbeans=true
spring.datasource.hikari.mbean-name=authDataSource

person.viewDates=false

#Heracles settings
heracles.smallcellcount=5

jasypt.encryptor.enabled=false
jasypt.encryptor.password=
jasypt.encryptor.algorithm=PBEWithMD5AndDES

#Kerberos settings
kerberos.timeout=60
kerberos.configPath=/etc/krb5.conf
kerberos.kinitPath=

#Organization Settings
organization.name=OHDSI

#JdbcTemplate
jdbc.suppressInvalidApiException=true

#Sensitive info settings
sensitiveinfo.admin.role=admin
sensitiveinfo.moderator.role=Moderator
sensitiveinfo.analysis.extensions=txt
analysis.result.zipVolumeSizeMb=100

#Cache Config
cdm.result.cache.warming.enable=true
cdm.cache.achilles.warming.enable=false
cdm.cache.cron.warming.enable=false
cdm.cache.cron.expression=0 0 2 * * *

cache.generation.invalidAfterDays=30
cache.generation.cleanupInterval=3600000
cache.generation.useAsync=false
cache.jobs.count=3

# Achilles cache
cache.achilles.usePersonCount=true

#Atlas geo spatial
atlasgis.enabled=false

#I18n
i18n.enabled=true
i18n.defaultLocale=en

#Tags
tag.enabled=true
tag.refreshStat.period=600000

#Versioning
versioning.maxAttempt=10

#Audit trail
audit.trail.enabled=false
audit.trail.log.file=/tmp/atlas/audit/audit.log
audit.trail.log.file.pattern=/tmp/atlas/audit/audit-%d{yyyy-MM-dd}-%i.log
audit.trail.log.extraFile=/tmp/atlas/audit/audit-extra.log

#Shiny
shiny.enabled=false